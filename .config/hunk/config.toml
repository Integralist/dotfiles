theme = "integralist"
mode = "unified"
hunk_headers = false
agent_notes = true
sidebar = true

# Watch native repository reviews, not stdin-based pager input.
[vcs]
watch = true

[themes.integralist]
base = "nord"
background = "#243751"
panel = "#2a3b56"
panelAlt = "#31455f"
border = "#50627c"
accent = "#88c0d0"
addedBg = "#2c4f39"
removedBg = "#6b3642"
movedAddedBg = "#355b5a"
movedRemovedBg = "#6b3f4b"
addedContentBg = "#366446"
removedContentBg = "#85434d"
contextBg = "#2a3b55"
contextContentBg = "#30445e"
addedSignColor = "#a5c47e"
removedSignColor = "#f08084"
badgeAdded = "#a5c47e"
badgeRemoved = "#f08084"
fileNew = "#a5c47e"
fileDeleted = "#f08084"

[themes.integralist.syntax_scopes]
"comment" = "#d0b28a"
"comment.line.double-slash.go" = "#d0b28a"
"punctuation.definition.comment" = "#d0b28a"
